[project]
name = "send2kindlebot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "bs4>=0.0.2",
    "configparser>=7.2.0",
    "dnspython>=2.9.0",
    "ebooklib>=0.20",
    "epub-meta>=0.0.7",
    "flask>=3.1.3",
    "pika>=1.4.4",
    "python-i18n>=0.3.9",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "telebot>=0.0.5",
    "validate-email>=1.3",
    "weasyprint>=70.0",
]

[project.scripts]
send2kindlebot = "send2kindlebot:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
